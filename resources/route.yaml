apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: append
  labels:
    app: ocs-inventory
  name: ocs-inventory
spec:
  host: ocs.pdcase.local
  port:
    targetPort: 8080
  to:
    kind: Service
    name: ocs-inventory
    weight: 100
  wildcardPolicy: None
  httpHeaders:
    forwardedHeaderPolicy: Append
    actions: 
      response: {}
