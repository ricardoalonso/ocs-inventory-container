apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ocs-inventory
  name: ocs-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocs-inventory
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ocs-inventory
    spec:
      containers:
      - env:
        - name: OCS_DB_USER
          valueFrom:
            secretKeyRef:
              key: mysql-user
              name: mysql
        - name: OCS_DB_PASS
          valueFrom:
            secretKeyRef:
              key: mysql-password
              name: mysql
        - name: OCS_DB_NAME
          valueFrom:
            secretKeyRef:
              key: mysql-database
              name: mysql
        - name: OCS_DB_SERVER
          value: mysql
        - name: APACHE_SERVER_NAME
          value: ocs.pdcase.local
        image: quay.io/ricardoalonsos/ocs-inventory:2.12.1
        imagePullPolicy: Always
        name: ocs-inventory
        ports:
        - containerPort: 8080
        resources: {}
status: {}
