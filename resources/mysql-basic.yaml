apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: mysql
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mysql
    spec:
      containers:
      - env:
        - name: MYSQL_USER
          value: ocs
        - name: MYSQL_PASSWORD
          password: mysqlocspdcase
        - name: MYSQL_DATABASE
          value: ocsweb
        - name: MYSQL_ROOT_PASSWORD
          value: mysqlocspdcase
        image: docker.io/mysql:8.4
        name: mysql
        ports:
        - containerPort: 3306
        resources: {}
status: {}
