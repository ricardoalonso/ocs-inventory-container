apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      app: ocs-inventory
    name: ocs-inventory
  spec:
    ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
    selector:
      app: ocs-inventory
    type: ClusterIP
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    labels:
      app: ocs-inventory
    name: ocs-inventory
  spec:
    host: ocs.pdcase.local
    port:
      targetPort: 8080
    to:
      kind: Service
      name: ocs-inventory
      weight: 100
    wildcardPolicy: None
